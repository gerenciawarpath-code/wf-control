<!doctype html>
<!-- WF Control · Warpath Forge -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WF Control</title>
    <!-- Tipografía display de marca: Saira (Google Fonts). Inter se carga vía @fontsource. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap"
    />
    <script>
      // Tema claro por defecto; reset de una sola vez para quien tenía oscuro guardado.
      // (misma lógica que src/lib/theme.tsx)
      try {
        if (!localStorage.getItem('wf-theme-reset')) {
          localStorage.setItem('wf-theme', 'light')
          localStorage.setItem('wf-theme-reset', '1')
        }
        document.documentElement.dataset.theme =
          localStorage.getItem('wf-theme') === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
